name: wikidex
description: "Une application de faits aléatoires Wikipedia"
publish_to: 'none'
version: 0.1.1+5

environment:
  sdk: ^3.7.0

dependencies:
  animated_text_kit: ^4.2.3
  card_swiper: ^3.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^4.1.0
  http: ^1.3.0
  intl: ^0.19.0
  lottie: ^3.3.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.2
  timezone: ^0.9.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
